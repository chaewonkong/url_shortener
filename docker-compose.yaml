services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # 호스트에서 cargo run 할 때 접근용. 배포 시엔 빼도 됨
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      SERVER_PORT: "3000"
      REDIS_URL: "redis://redis:6379/"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
